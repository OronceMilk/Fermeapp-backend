{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto">
    <h2 class="text-3xl font-black text-[#1e3a5f] mb-6">Nouvelle Transaction</h2>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-4">
                <label class="block text-xs font-semibold uppercase tracking-widest mb-2 text-[#1e3a5f]">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <p class="text-xs text-red-600 mt-1">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="w-full bg-[#7cb518] hover:bg-[#689914] text-white font-bold py-3 rounded-xl shadow-lg transition mt-2">
                Enregistrer
            </button>
        </form>
    </div>
</div>
{% endblock %}
